<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho | SPAN Games</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/carrinho.css">
</head>

<body>

    <!-- HEADER -->
    <div id="header"></div>


    <!-- PÁGINA DO CARRINHO -->
    <main class="pagina-carrinho">

        <h1>Meu Carrinho</h1>

        <div class="conteudo-carrinho">

            <!-- PRODUTOS -->
            <section class="itens-carrinho">

                <div id="listaCarrinho"></div>

            </section>


            <!-- RESUMO -->
            <aside class="resumo-carrinho">

                <h2>Resumo da compra</h2>

                <div class="linha-resumo">
                    <span>Subtotal</span>
                    <strong id="subtotal">R$ 0,00</strong>
                </div>

                <div class="linha-resumo">
                    <span>Frete</span>
                    <strong>Grátis</strong>
                </div>

                <hr>

                <div class="total-carrinho">
                    <span>Total</span>
                    <strong id="total">R$ 0,00</strong>
                </div>

                <button class="btn-finalizar">
                    Finalizar compra
                </button>

            </aside>

        </div>

    </main>


    <!-- SCRIPTS -->
    <script src="js/header.js"></script>
    <script src="js/carrinho.js"></script>
    <script src="js/carrinhopagina.js"></script>

</body>

</html>
