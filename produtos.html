<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos | SPAN Games</title>

<link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/produtos.css">
</head>

<body>


    <div id="header"></div>

    <!-- Conteúdo específico da página -->

    <script src="js/header.js"></script>


    <!-- PÁGINA DE PRODUTOS -->
    <main class="pagina-produtos">

        <h1>Todos os Produtos</h1>

        <p class="subtitulo">
            Encontre os melhores produtos para o seu setup gamer.
        </p>


        <!-- FILTROS -->
      <section class="filtros">

    <button type="button" data-categoria="todos">
        Todos
    </button>

    <button type="button" data-categoria="1">
        Mouses
    </button>

    <button type="button" data-categoria="2">
        Monitores
    </button>

    <button type="button" data-categoria="3">
        Headsets
    </button>

    <button type="button" data-categoria="4">
        Teclados
    </button>

    <button type="button" data-categoria="5">
        Controles
    </button>

</section>

<div class="filtro-atual">
    Mostrando: <strong>Todos os produtos</strong>
</div>

<section id="listaProdutos" class="lista-produtos">



        <!-- LISTA DE PRODUTOS -->
        <section id="listaProdutos" class="lista-produtos">

        </section>

    </main>


    <!-- DADOS DOS PRODUTOS -->
    <script src="js/dadosprodutos.js"></script>

    <!-- JS EXCLUSIVO DA PÁGINA DE PRODUTOS -->
    <script src="js/produtospagina.js"></script>

   <!--CARRINHO DE COMPRAS-->
    <script src="js/carrinho.js"></script>

</html>
