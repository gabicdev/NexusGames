<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | SPAN GAMES</title>

    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="acessibilidade.css">
</head>

<body>

    <header>
        <a href="index.html">
            <span>SPAN</span>
            <span>GAMES</span>
        </a>
    </header>

    <main>

        <form id="formCadastro" novalidate>

            <h1>CADASTRO</h1>

            <!-- DADOS PESSOAIS -->
            <section>

                <h2>
                    <img src="img/dados-pessoais.svg" alt="">
                    Dados Pessoais
                </h2>

                <div class="campos">

                    <div class="campo">
                        <input type="text" id="nome" name="nome" autocomplete="name">
                        <label for="nome">Nome completo</label>
                        <span class="mensagem-erro" id="erroNome"></span>
                    </div>

                    <div class="campo">
                        <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14">
                        <label for="cpf">CPF</label>
                        <span class="mensagem-erro" id="erroCpf"></span>
                    </div>

                    <div class="campo campo-email">
                        <input type="email" id="email" name="email" autocomplete="email">
                        <label for="email">E-mail</label>
                        <span class="mensagem-erro" id="erroEmail"></span>
                    </div>

                </div>

            </section>


            <!-- CONTATO -->
            <section>

                <h2>
                    <img src="img/contato.svg" alt="">
                    Contato
                </h2>

                <div class="campos">

                    <div class="campo">
                        <input type="tel" id="celular" name="celular" inputmode="numeric">
                        <label for="celular">Telefone Celular</label>
                        <span class="mensagem-erro" id="erroCelular"></span>
                    </div>

                    <div class="campo">
                        <input type="tel" id="telefone" name="telefone" inputmode="numeric">
                        <label for="telefone">Telefone Fixo</label>
                        <span class="mensagem-erro" id="erroTelefone"></span>
                    </div>

                </div>

            </section>


            <!-- ENDEREÇO -->
            <section>

                <h2>
                    <img src="img/endereco.svg" alt="">
                    Endereço
                </h2>

                <div class="campos">

                    <div class="campo">
                        <input type="text" id="cep" name="cep" inputmode="numeric" maxlength="9">
                        <label for="cep">CEP</label>
                        <span class="mensagem-erro" id="erroCep"></span>
                    </div>

                    <div class="campo">
                        <input type="text" id="rua" name="rua" autocomplete="street-address" readonly>
                        <label for="rua">Rua</label>
                        <span class="mensagem-erro" id="erroRua"></span>
                    </div>

                    <div class="campo">
                        <input type="text" id="cidade" name="cidade" autocomplete="address-level2" readonly>
                        <label for="cidade">Cidade</label>
                        <span class="mensagem-erro" id="erroCidade"></span>
                    </div>

                    <div class="campo">
                        <input type="text" id="bairro" name="bairro" autocomplete="address-line2" readonly>
                        <label for="bairro">Bairro</label>
                        <span class="mensagem-erro" id="erroBairro"></span>
                    </div>

                    <div class="campo">
                        <input type="text" id="uf" name="uf" maxlength="2" autocomplete="address-level1" readonly>
                        <label for="uf">UF</label>
                        <span class="mensagem-erro" id="erroUf"></span>
                    </div>

                </div>

            </section>


            <!-- ACESSO -->
            <section>

                <h2>
                    <img src="img/acesso.svg" alt="">
                    Acesso
                </h2>

                <div class="campos">

                    <div class="campo">
                        <input type="text" id="login" name="login" maxlength="6">
                        <label for="login">Login</label>
                        <span class="mensagem-erro" id="erroLogin"></span>
                    </div>

                    <div class="campo">
                        <input type="password" id="senha" name="senha" maxlength="8">
                        <label for="senha">Senha</label>

                        <button type="button" class="botao-olho" id="mostrarSenha">
                            <img src="img/eyeoff.svg" alt="Mostrar senha">
                        </button>

                        <span class="mensagem-erro" id="erroSenha"></span>
                    </div>

                    <div class="campo">
                        <input type="password" id="confirmacao" name="confirmacao" maxlength="8">
                        <label for="confirmacao">Confirmação de senha</label>

                        <button type="button" class="botao-olho" id="mostrarConfirmacao">
                            <img src="img/eyeoff.svg" alt="Mostrar confirmação de senha">
                        </button>

                        <span class="mensagem-erro" id="erroConfirmacao"></span>
                    </div>

                </div>

            </section>


            <!-- TERMOS -->
            <div class="termos">

                <input type="checkbox" id="termos" name="termos">

                <label for="termos">
                    Estou ciente e CONCORDO com os termos e políticas de privacidade da SPAN GAMES
                </label>

            </div>

            <span class="mensagem-erro erro-termos" id="erroTermos"></span>

            <button type="submit" class="botao-cadastrar">
                Cadastrar
            </button>

            <div class="mensagem-sucesso" id="mensagemSucesso"></div>

            <a class="voltar" href="login.html">Voltar para o login</a>

        </form>

    </main>

        <!-- ACESSIBILIDADE -->
    <div class="acessibilidade">

        <button type="button" class="botao-acessibilidade" id="botaoAcessibilidade">
            <img src="img/acessibilidade.svg" alt="Acessibilidade">
        </button>

        <div class="painel-acessibilidade" id="painelAcessibilidade">

            <div class="opcao-acessibilidade">
                <span>Tema</span>

                <button type="button" id="temaClaro">
                    <img src="img/sun.svg" alt="Tema Claro">
                </button>

                <button type="button" id="temaEscuro">
                    <img src="img/moon.svg" alt="Tema Escuro">
                </button>
            </div>

            <div class="opcao-acessibilidade">
                <span>Fonte</span>

                <button type="button" id="diminuirFonte">
                    <img src="img/fontemenos.svg" alt="Diminuir fonte">
                </button>

                <button type="button" id="aumentarFonte">
                    <img src="img/fontemais.svg" alt="Aumentar fonte">
                </button>
            </div>

        </div>

    </div>

    <script src="acessibilidade.js"></script>
    <script src="cadastro.js"></script>

</body>

</html>
